<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>围棋</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #15171c;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  body { display: flex; justify-content: center; align-items: center; padding: 6px; }

  .game-container {
    background: #1d2026;
    border: 1px solid #333842;
    padding: 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: 100%; height: 100%;
    max-width: 460px;
  }

  .top-row { display: flex; gap: 6px; width: 100%; flex: 0 0 auto; }
  .info-box {
    flex: 1;
    background: #14161a; border: 1px solid #333842;
    padding: 4px 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .info-box .label { color: #6c7484; font-size: 11px; }
  .info-box .value { color: #d8d8d8; font-size: 15px; font-weight: bold; }

  .board-wrap {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  canvas#board {
    display: block;
    background: #d9b382;
    border: 1px solid #333842;
    border-radius: 4px;
    touch-action: none;
  }

  .status {
    text-align: center;
    color: #b7c0d0;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    min-height: 22px;
    flex: 0 0 auto;
  }

  .touch-controls { width: 100%; display: flex; flex-direction: column; gap: 5px; flex: 0 0 auto; }
  .control-row { display: flex; gap: 5px; }
  .touch-btn {
    flex: 1;
    background: #262a32; border: 1px solid #3a404b; color: #cfd4dc;
    border-radius: 4px; font-size: 14px; font-family: inherit;
    padding: 11px 0; cursor: pointer;
  }
  .touch-btn:active { background: #313742; }
  .touch-btn.small { font-size: 12px; }
  .touch-btn.active { background: #3a4f6b; border-color: #5a7aa0; color: #d8e6ff; }
  .touch-btn:disabled { opacity: 0.4; }

  .hint {
    text-align: center;
    color: #6c7484;
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    display: flex; justify-content: center; align-items: center;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .panel {
    background: #1d2026; border: 1px solid #3a404b; border-radius: 8px;
    padding: 20px 24px; min-width: 260px; max-width: 90%;
    color: #cfd4dc; font-size: 14px;
  }
  .panel h3 { margin: 0 0 16px; font-size: 16px; color: #e0e0e0; text-align: center; font-weight: normal; letter-spacing: 2px; }
  .level-btn {
    display: block; width: 100%; margin-bottom: 8px;
    background: #262a32; border: 1px solid #3a404b; color: #cfd4dc;
    border-radius: 4px; padding: 11px 0; font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .level-btn.active { background: #3a4f6b; border-color: #5a7aa0; color: #d8e6ff; }
  .level-btn:active { background: #313742; }
  .panel .close { margin-top: 12px; }
  .panel .desc { color: #8a94a6; font-size: 12px; line-height: 1.6; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="game-container">
  <div class="top-row">
    <div class="info-box">
      <span class="label">你（黑）</span>
      <span class="value" id="blackScore">0</span>
    </div>
    <div class="info-box">
      <span class="label">AI（白）</span>
      <span class="value" id="whiteScore">0</span>
    </div>
    <div class="info-box">
      <span class="label">提示/悔棋</span>
      <span class="value" id="resDisplay">3/3</span>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="board"></canvas>
  </div>

  <div class="status" id="statusText">黑方走棋</div>

  <div class="touch-controls">
    <div class="control-row">
      <button class="touch-btn small" id="hintBtn">提示</button>
      <button class="touch-btn small" id="undoBtn">悔棋</button>
      <button class="touch-btn small" id="passBtn">停一手</button>
      <button class="touch-btn small" id="modeBtn">选模式</button>
      <button class="touch-btn small" id="resetBtn">重开</button>
    </div>
    <div class="hint">点交叉点落子 · 无气棋子会被提掉</div>
  </div>
</div>

<div class="overlay hidden" id="modeOverlay">
  <div class="panel">
    <h3>选择模式</h3>
    <div class="desc">
      规则：气、提子、禁自杀、打劫。双方连续停一手后按"数子法"结算：围住的空 + 盘上子，地盘多者胜。
    </div>
    <button class="level-btn" data-mode="pvp">双人对战</button>
    <button class="level-btn" data-mode="easy">人机 · 简单（会吃子）</button>
    <button class="level-btn" data-mode="normal">人机 · 普通（会占角）</button>
    <button class="level-btn close" id="modeClose">取消</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const wrap = canvas.parentElement;
  const blackScoreEl = document.getElementById('blackScore');
  const whiteScoreEl = document.getElementById('whiteScore');
  const resDisplay = document.getElementById('resDisplay');
  const statusText = document.getElementById('statusText');
  const hintBtn = document.getElementById('hintBtn');
  const undoBtn = document.getElementById('undoBtn');
  const passBtn = document.getElementById('passBtn');
  const modeBtn = document.getElementById('modeBtn');
  const resetBtn = document.getElementById('resetBtn');
  const modeOverlay = document.getElementById('modeOverlay');
  const modeClose = document.getElementById('modeClose');

  const N = 9;
  let cellSize = 34;
  const MARGIN = 20;

  let board = [];
  let turn = 1;
  let gameEnd = false;

  let mode = 'easy';
  let hintsLeft = 3;
  let undosLeft = 3;

  let history = [];
  let koPoint = null;
  let passCount = 0;

  const PLAYER = 1;
  const AI = 2;
  let aiThinking = false;

  // ---------- 初始化 ----------
  function initGame() {
    board = Array.from({ length: N }, () => Array(N).fill(0));
    turn = 1;
    gameEnd = false;
    hintsLeft = 3;
    undosLeft = 3;
    history = [];
    koPoint = null;
    passCount = 0;
    aiThinking = false;
    updateUI();
    resizeCanvas();
    draw();
    safeAIMove();
  }

  function resizeCanvas() {
    const maxW = wrap.clientWidth;
    const maxH = wrap.clientHeight;
    const availW = maxW > 0 ? maxW : Math.min(window.innerWidth - 30, 440);
    const availH = maxH > 0 ? maxH : Math.min(window.innerHeight - 240, 560);
    const usable = Math.min(availW, availH) - MARGIN * 2;
    cellSize = Math.max(16, Math.floor(usable / (N - 1)));
    const size = (N - 1) * cellSize + MARGIN * 2;
    if (canvas.width !== size || canvas.height !== size) {
      canvas.width = size;
      canvas.height = size;
    }
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
  }

  function pos(r, c) {
    return { x: MARGIN + c * cellSize, y: MARGIN + r * cellSize };
  }

  function cellFromXY(x, y) {
    const c = Math.round((x - MARGIN) / cellSize);
    const r = Math.round((y - MARGIN) / cellSize);
    if (r < 0 || r >= N || c < 0 || c >= N) return null;
    const p = pos(r, c);
    if (Math.hypot(x - p.x, y - p.y) > cellSize * 0.55) return null;
    return { r, c };
  }

  // ---------- 绘制 ----------
  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#d9b382';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#8a6b45';
    ctx.lineWidth = 1;
    for (let i = 0; i < N; i++) {
      const a = pos(i, 0), b = pos(i, N - 1);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      const c = pos(0, i), d = pos(N - 1, i);
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
    }

    const stars = [[2,2],[2,6],[6,2],[6,6],[4,4]];
    ctx.fillStyle = '#5a3b1e';
    for (const [r, c] of stars) {
      const p = pos(r, c);
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(2, cellSize * 0.08), 0, Math.PI * 2);
      ctx.fill();
    }

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const v = board[r][c];
        if (v === 0) continue;
        const p = pos(r, c);
        const rad = cellSize * 0.44;
        ctx.beginPath();
        ctx.arc(p.x + 1, p.y + 1, rad, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,.25)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fillStyle = v === 1 ? '#1d2026' : '#f0f0f0';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.35)';
        ctx.stroke();
      }
    }

    if (history.length > 0) {
      const last = history[history.length - 1];
      if (!last.pass) {
        const p = pos(last.r, last.c);
        ctx.beginPath();
        ctx.strokeStyle = '#ff6f61';
        ctx.lineWidth = 2;
        ctx.arc(p.x, p.y, cellSize * 0.15, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    if (gameEnd) {
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.font = 'bold ' + Math.floor(Math.min(W, H) * 0.09) + 'px Arial, sans-serif';
      ctx.fillStyle = '#ffd966';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const s = countTerritory();
      ctx.fillText(s.black > s.white ? '黑方胜' : s.black < s.white ? '白方胜' : '平局', W / 2, H / 2);
    }
  }

  // ---------- 围棋核心 ----------
  function getGroupAndLiberties(r, c) {
    const color = board[r][c];
    if (color === 0) return { group: [], liberties: new Set() };
    const group = [];
    const liberties = new Set();
    const visited = new Set();
    const stack = [{ r, c }];
    visited.add(r * N + c);

    while (stack.length) {
      const { r: cr, c: cc } = stack.pop();
      group.push({ r: cr, c: cc });
      const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
      for (const [dr, dc] of dirs) {
        const nr = cr + dr, nc = cc + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
        const key = nr * N + nc;
        if (visited.has(key)) continue;
        if (board[nr][nc] === 0) {
          liberties.add(key);
        } else if (board[nr][nc] === color) {
          visited.add(key);
          stack.push({ r: nr, c: nc });
        }
      }
    }
    return { group, liberties };
  }

  function tryPlay(r, c, color) {
    if (r < 0 || r >= N || c < 0 || c >= N) return { ok: false };
    if (board[r][c] !== 0) return { ok: false };
    if (koPoint && koPoint.r === r && koPoint.c === c) return { ok: false };

    board[r][c] = color;
    const opp = color === 1 ? 2 : 1;
    const captured = [];
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];

    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
      if (board[nr][nc] === opp) {
        const { group, liberties } = getGroupAndLiberties(nr, nc);
        if (liberties.size === 0) {
          for (const g of group) {
            captured.push(g);
            board[g.r][g.c] = 0;
          }
        }
      }
    }

    const { liberties: selfLib } = getGroupAndLiberties(r, c);
    if (selfLib.size === 0) {
      board[r][c] = 0;
      for (const g of captured) board[g.r][g.c] = opp;
      return { ok: false };
    }

    let newKo = null;
    if (captured.length === 1) {
      const cap = captured[0];
      if (selfLib.size === 1) {
        newKo = { r: cap.r, c: cap.c };
      }
    }

    for (const g of captured) board[g.r][g.c] = opp;
    board[r][c] = 0;

    return { ok: true, captured, newKo };
  }

  function play(r, c) {
    if (gameEnd) return false;
    if (board[r][c] !== 0) return false;
    if (koPoint && koPoint.r === r && koPoint.c === c) {
      statusText.textContent = '打劫禁着点';
      return false;
    }

    const res = tryPlay(r, c, turn);
    if (!res.ok) return false;

    const player = turn;
    board[r][c] = player;
    const opp = player === 1 ? 2 : 1;
    const captured = [];
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
      if (board[nr][nc] === opp) {
        const { group, liberties } = getGroupAndLiberties(nr, nc);
        if (liberties.size === 0) {
          for (const g of group) {
            captured.push(g);
            board[g.r][g.c] = 0;
          }
        }
      }
    }

    koPoint = res.newKo || null;
    passCount = 0;

    history.push({ r, c, player, captured });
    turn = opp;
    updateUI();
    draw();

    if (isBoardFull()) {
      gameEnd = true;
      updateUI();
      draw();
      return true;
    }
    safeAIMove();
    return true;
  }

  function pass() {
    if (gameEnd) return;
    passCount++;
    history.push({ pass: true, player: turn });
    turn = turn === 1 ? 2 : 1;
    updateUI();
    draw();
    if (passCount >= 2) {
      gameEnd = true;
      updateUI();
      draw();
      return;
    }
    safeAIMove();
  }

  function isBoardFull() {
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++)
        if (board[r][c] === 0) return false;
    return true;
  }

  // ---------- 数子法：围空 + 盘上子 ----------
  function countTerritory() {
    // 对每个空点做洪泛，看它被谁围住
    const visited = new Set();
    let blackTerr = 0, whiteTerr = 0;
    let blackStones = 0, whiteStones = 0;

    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++) {
        if (board[r][c] === 1) blackStones++;
        else if (board[r][c] === 2) whiteStones++;
      }

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (board[r][c] !== 0) continue;
        const key = r * N + c;
        if (visited.has(key)) continue;

        // 洪泛这块空区
        const region = [];
        const borders = new Set();   // 接触到哪些颜色
        const stack = [{ r, c }];
        visited.add(key);

        while (stack.length) {
          const { r: cr, c: cc } = stack.pop();
          region.push({ r: cr, c: cc });
          const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
          for (const [dr, dc] of dirs) {
            const nr = cr + dr, nc = cc + dc;
            if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
            const k2 = nr * N + nc;
            if (board[nr][nc] === 0) {
              if (!visited.has(k2)) { visited.add(k2); stack.push({ r: nr, c: nc }); }
            } else {
              borders.add(board[nr][nc]);
            }
          }
        }

        // 只被一方围住，这空就算它的
        if (borders.size === 1) {
          const owner = borders.values().next().value;
          if (owner === 1) blackTerr += region.length;
          else whiteTerr += region.length;
        }
      }
    }

    return {
      black: blackStones + blackTerr,
      white: whiteStones + whiteTerr,
      blackTerr, whiteTerr, blackStones, whiteStones
    };
  }

  // ---------- AI ----------
  function safeAIMove() {
    if (gameEnd) return;
    if (mode === 'pvp') return;
    if (turn !== AI) return;
    if (aiThinking) return;
    aiThinking = true;
    statusText.textContent = 'AI 思考中…';

    setTimeout(() => {
      let mv = null;
      try {
        mv = pickAIMove(AI, mode);
      } catch (e) {
        mv = null;
      }
      aiThinking = false;

      if (mv && mv.r >= 0 && mv.r < N && mv.c >= 0 && mv.c < N && board[mv.r][mv.c] === 0) {
        play(mv.r, mv.c);
      } else {
        // 找不到落点：停一手
        pass();
      }
    }, 60);
  }

  function candidatesNear() {
    const seen = new Set();
    const list = [];
    let anyStone = false;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (board[r][c] === 0) continue;
        anyStone = true;
        for (let dr = -2; dr <= 2; dr++) {
          for (let dc = -2; dc <= 2; dc++) {
            const rr = r + dr, cc = c + dc;
            if (rr < 0 || rr >= N || cc < 0 || cc >= N) continue;
            if (board[rr][cc] !== 0) continue;
            if (koPoint && koPoint.r === rr && koPoint.c === cc) continue;
            const key = rr * N + cc;
            if (seen.has(key)) continue;
            seen.add(key);
            list.push({ r: rr, c: cc });
          }
        }
      }
    }
    if (!anyStone) {
      return [{ r: Math.floor(N/2), c: Math.floor(N/2) }];
    }
    return list;
  }

  function pickAIMove(aiColor, level) {
    const opp = aiColor === 1 ? 2 : 1;
    const candidates = candidatesNear();
    if (candidates.length === 0) return null;

    // 先过滤掉非法落点（自杀、打劫）
    const legal = [];
    for (const cell of candidates) {
      const res = tryPlay(cell.r, cell.c, aiColor);
      if (res.ok) legal.push(cell);
    }
    if (legal.length === 0) return null;   // 没有合法点 → 停一手

    // 简单档
    if (level === 'easy') {
      // 40% 随机
      if (Math.random() < 0.4) {
        return legal[Math.floor(Math.random() * legal.length)];
      }
    }

    const startTime = Date.now();
    const TIME_LIMIT = 800;

    let best = null;
    let bestScore = -Infinity;

    for (const cell of legal) {
      if (Date.now() - startTime > TIME_LIMIT) break;

      const { r, c } = cell;
      let score = 0;

      const res = tryPlay(r, c, aiColor);
      score += res.captured.length * 100;

      board[r][c] = aiColor;
      const { liberties } = getGroupAndLiberties(r, c);
      const selfLib = liberties.size;
      board[r][c] = 0;

      score += selfLib * 3;
      if (selfLib === 1) score -= 40;

      const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
        if (board[nr][nc] === aiColor) {
          const { liberties: lib2 } = getGroupAndLiberties(nr, nc);
          if (lib2.size === 1) score += 60;
          else if (lib2.size === 2) score += 15;
        }
      }

      const centerDist = Math.abs(r - 4) + Math.abs(c - 4);
      score += (8 - centerDist) * 2;

      let neighbors = 0;
      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
        if (board[nr][nc] !== 0) neighbors++;
      }
      score += neighbors * 5;

      score += (Math.random() * 2 - 1) * 8;

      if (score > bestScore) {
        bestScore = score;
        best = cell;
      }
    }

    if (!best) best = legal[0];
    return best;
  }

  // ---------- UI ----------
  function updateUI() {
    const s = countTerritory();
    blackScoreEl.textContent = s.black;
    whiteScoreEl.textContent = s.white;
    resDisplay.textContent = hintsLeft + '/' + undosLeft;

    hintBtn.disabled = hintsLeft <= 0 || gameEnd || aiThinking;
    undoBtn.disabled = undosLeft <= 0 || history.length === 0 || aiThinking;
    passBtn.disabled = gameEnd || aiThinking;

    if (gameEnd) {
      if (s.black > s.white) statusText.textContent = '黑方胜！(' + s.black + ':' + s.white + ')';
      else if (s.black < s.white) statusText.textContent = '白方胜！(' + s.white + ':' + s.black + ')';
      else statusText.textContent = '平局 (' + s.black + ':' + s.white + ')';
    } else {
      statusText.textContent = (turn === 1 ? '黑方' : '白方') + '走棋' +
        (koPoint ? '（打劫禁着）' : '');
    }
  }

  // ---------- 交互 ----------
  let touchUsed = false;

  function handleTap(e) {
    if (gameEnd || aiThinking) return;
    if (mode !== 'pvp' && turn === AI) return;

    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    if (e.changedTouches && e.changedTouches.length) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else if (e.touches && e.touches.length) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    const x = (clientX - rect.left) / rect.width * canvas.width;
    const y = (clientY - rect.top) / rect.height * canvas.height;
    const cell = cellFromXY(x, y);
    if (!cell) return;
    play(cell.r, cell.c);
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchUsed = true;
    handleTap(e);
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    if (touchUsed) return;
    handleTap(e);
  });
  canvas.addEventListener('mouseup', () => { touchUsed = false; });

  // ---------- 按钮 ----------
  function showHint() {
    if (hintsLeft <= 0 || gameEnd || aiThinking) return;
    let mv = null;
    try { mv = pickAIMove(turn, 'normal'); } catch (e) { mv = null; }
    if (!mv) return;
    hintsLeft--;
    updateUI();
    draw();
    const p = pos(mv.r, mv.c);
    ctx.beginPath();
    ctx.strokeStyle = '#7ee0a0';
    ctx.lineWidth = 3;
    ctx.arc(p.x, p.y, cellSize * 0.45, 0, Math.PI * 2);
    ctx.stroke();
  }

  function undoMove() {
    if (undosLeft <= 0 || aiThinking) return;
    if (history.length === 0) return;

    let steps = 2;
    if (mode === 'pvp') steps = 1;

    for (let i = 0; i < steps && history.length > 0; i++) {
      const h = history.pop();
      if (h.pass) {
        turn = h.player;
        passCount = Math.max(0, passCount - 1);
      } else {
        board[h.r][h.c] = 0;
        for (const g of h.captured) {
          board[g.r][g.c] = h.player === 1 ? 2 : 1;
        }
        turn = h.player;
      }
    }
    koPoint = null;
    gameEnd = false;
    undosLeft--;

    updateUI();
    draw();

    // 关键：悔棋后如果轮到 AI，自动让 AI 走
    safeAIMove();
  }

  function openMode() {
    modeOverlay.querySelectorAll('.level-btn[data-mode]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    modeOverlay.classList.remove('hidden');
  }

  hintBtn.addEventListener('click', showHint);
  hintBtn.addEventListener('touchstart', (e) => { e.preventDefault(); showHint(); }, { passive: false });

  undoBtn.addEventListener('click', undoMove);
  undoBtn.addEventListener('touchstart', (e) => { e.preventDefault(); undoMove(); }, { passive: false });

  function doPass() {
    if (gameEnd || aiThinking) return;
    if (mode !== 'pvp' && turn === AI) return;
    pass();
  }
  passBtn.addEventListener('click', doPass);
  passBtn.addEventListener('touchstart', (e) => { e.preventDefault(); doPass(); }, { passive: false });

  modeBtn.addEventListener('click', openMode);
  modeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); openMode(); }, { passive: false });

  resetBtn.addEventListener('click', initGame);
  resetBtn.addEventListener('touchstart', (e) => { e.preventDefault(); initGame(); }, { passive: false });

  modeOverlay.querySelectorAll('.level-btn[data-mode]').forEach(btn => {
    const handler = (e) => {
      e.preventDefault();
      mode = btn.dataset.mode;
      modeOverlay.classList.add('hidden');
      initGame();
    };
    btn.addEventListener('click', handler);
    btn.addEventListener('touchstart', handler, { passive: false });
  });
  modeClose.addEventListener('click', () => modeOverlay.classList.add('hidden'));
  modeClose.addEventListener('touchstart', (e) => { e.preventDefault(); modeOverlay.classList.add('hidden'); }, { passive: false });

  window.addEventListener('resize', () => { resizeCanvas(); draw(); });
  window.addEventListener('orientationchange', () => { setTimeout(() => { resizeCanvas(); draw(); }, 200); });

  initGame();
})();
</script>
</body>
</html>
